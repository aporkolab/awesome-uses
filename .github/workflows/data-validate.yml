name: Validate data.js

on:
  pull_request:
    paths: src/data.js

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: npm

    - name: Install Dependencies
      run: npm install

    - name: Validate data.js
      run: node ./scripts/data-validate.js
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
